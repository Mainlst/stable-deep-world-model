defaults:

  logdir: null
  traindir: null
  evaldir: null
  offline_traindir: ''
  offline_evaldir: ''
  seed: 0
  deterministic_run: False
  steps: 1e6
  parallel: False
  eval_every: 1e4
  eval_episode_num: 10
  log_every: 1e4
  reset_every: 0
  device: 'cuda:0'
  compile: True
  precision: 32
  debug: False
  video_pred_log: True

  # Environment
  task: 'dmc_walker_walk'
  size: [64, 64]
  envs: 1
  action_repeat: 2
  time_limit: 1000
  grayscale: False
  prefill: 2500
  reward_EMA: True

  # Model
  dyn_hidden: 512
  dyn_deter: 512
  dyn_stoch: 32
  dyn_discrete: 32
  dyn_rec_depth: 1
  dyn_mean_act: 'none'
  dyn_std_act: 'sigmoid2'
  dyn_min_std: 0.1
  grad_heads: ['decoder', 'reward', 'cont']
  units: 512
  act: 'SiLU'
  norm: True
  encoder:
    {mlp_keys: '$^', cnn_keys: 'image', act: 'SiLU', norm: True, cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, symlog_inputs: True}
  decoder:
    {mlp_keys: '$^', cnn_keys: 'image', act: 'SiLU', norm: True, cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, cnn_sigmoid: False, image_dist: mse, vector_dist: symlog_mse, outscale: 1.0}
  actor:
    {layers: 2, dist: 'normal', entropy: 3e-4, unimix_ratio: 0.01, std: 'learned', min_std: 0.1, max_std: 1.0, temp: 0.1, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 1.0}
  critic:
    {layers: 2, dist: 'symlog_disc', slow_target: True, slow_target_update: 1, slow_target_fraction: 0.02, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 0.0}
  reward_head:
    {layers: 2, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  cont_head:
    {layers: 2, loss_scale: 1.0, outscale: 1.0}
  dyn_scale: 0.5
  rep_scale: 0.1
  kl_free: 1.0
  weight_decay: 0.0
  unimix_ratio: 0.01
  initial: 'learned'

  # VTA (Variational Temporal Abstraction) parameters
  dynamics_type: 'vta'  # 'rssm' or 'vta'
  vta_abs_belief: 512    # Abstract belief size
  vta_abs_stoch: 32      # Abstract stochastic size
  vta_obs_belief: 512    # Observation belief size
  vta_obs_stoch: 32      # Observation stochastic size
  vta_max_seg_len: 50    # Maximum segment length before forced boundary
  vta_max_seg_num: 200    # Maximum number of segments
  vta_boundary_temp: 1.0 # Gumbel-softmax temperature for boundary sampling
  vta_boundary_force_scale: 10.0 # Hard forcing strength at segment limits (0 disables)
  vta_imag_type: 'full'  # 'jumpy' (abstract only) or 'full' (both levels)
  vta_imag_boundary: 'prior'  # 'prior', 'fixed', or 'none'
  vta_mask_scale: 1.0  # weight for kl_mask loss (trains Prior BD to match Post BD)
  vta_boundary_rate: 0.0  # target READ rate for boundary prior (0 disables)
  vta_boundary_scale: 0.0 # weight for boundary prior loss
  vta_posterior_input: 'embed' # 'embed' or 'embed_reward'

  # Director Hierarchical Policy
  use_director: False  # Enable Director-style hierarchical policy
  director_manager_mode: 'fixed'  # 'fixed' (K steps) or 'boundary' (VTA boundaries)
  director_skill_duration: 8  # Fixed interval for manager calls
  director_skill_stoch: 8  # Goal AE latent stochastic dimension
  director_skill_discrete: 8  # Goal AE latent discrete categories
  
  # Goal Autoencoder
  director_goal_ae_hidden: 512
  director_goal_ae_layers: 4
  director_goal_ae_lr: 1e-4
  director_goal_ae_kl_config: {impl: mult, scale: 0.0, target: 10.0, min: 1e-5, max: 1.0}
  director_goal_ae_unimix: 0.01
  goal_ae_dist: 'mse'  # Official Director uses mse
  director_adver_impl: 'squared'  # Official Director uses 'squared'
  
  # Manager Policy
  director_manager_layers: 4
  director_manager_units: 512
  director_manager_lr: 1e-4  # Official: actor_opt.lr = 1e-4
  director_manager_outscale: 0.1
  director_manager_extr_weight: 1.0  # Weight for extrinsic reward
  director_manager_expl_weight: 0.1  # Weight for exploration reward
  
  # Worker Policy
  director_worker_layers: 4
  director_worker_units: 512
  director_worker_lr: 1e-4  # Official: actor_opt.lr = 1e-4
  director_worker_outscale: 0.1
  # Worker reward weights (like official Director worker_rews)
  director_worker_extr_weight: 0.0  # Weight for extrinsic (task) reward
  director_worker_goal_weight: 1.0  # Weight for goal reward
  # Automatic entropy adjustment (like official Director actent)
  director_worker_entropy_scale: 3e-3  # Initial entropy bonus scale
  director_worker_entropy_target: 1.5  # Target entropy (raised to prevent collapse)
  director_worker_entropy_min: 1e-5    # Minimum entropy scale
  director_worker_entropy_max: 1e2     # Maximum entropy scale
  director_worker_entropy_vel: 0.1     # Adjustment velocity
  
  # Goal reward configuration
  director_goal_reward: 'cosine'  # 'cosine_max', 'cosine', 'l2', 'mse'
  director_use_delta: False  # Use goal delta instead of absolute goal (Disabled for stability)
  director_manager_input: 'abs_feat'  # 'abs_feat' or 'obs_feat'

  # Training
  batch_size: 16
  batch_length: 64
  train_ratio: 512
  pretrain: 100
  model_lr: 1e-4
  opt_eps: 1e-8
  grad_clip: 100  # Official: clip = 100.0
  dataset_size: 1000000
  opt: 'adam'

  # Behavior.
  discount: 0.99  # dreamerv3 = 0.997, director = 0.99
  discount_lambda: 0.95
  imag_horizon: 16  # dreamerv3 = 15, director = 16
  imag_gradient: 'dynamics'
  imag_gradient_mix: 0.0
  eval_state_mean: False

  # Exploration
  expl_behavior: 'greedy'
  expl_until: 0
  expl_extr_scale: 0.0
  expl_intr_scale: 1.0
  disag_target: 'stoch'
  disag_log: True
  disag_models: 10
  disag_offset: 1
  disag_layers: 4
  disag_units: 400
  disag_action_cond: False

dmc_proprio:
  steps: 5e5
  action_repeat: 2
  envs: 4
  train_ratio: 512
  video_pred_log: false
  encoder: {mlp_keys: '.*', cnn_keys: '$^'}
  decoder: {mlp_keys: '.*', cnn_keys: '$^'}

dmc_vision:
  steps: 1e6
  action_repeat: 2
  envs: 4
  train_ratio: 512
  video_pred_log: true
  encoder: {mlp_keys: '$^', cnn_keys: 'image'}
  decoder: {mlp_keys: '$^', cnn_keys: 'image'}

crafter:
  task: crafter_reward
  step: 1e6
  action_repeat: 1
  envs: 1
  train_ratio: 512
  video_pred_log: true
  dyn_hidden: 1024
  dyn_deter: 4096
  units: 1024
  encoder: {mlp_keys: '$^', cnn_keys: 'image', cnn_depth: 96, mlp_layers: 5, mlp_units: 1024}
  decoder: {mlp_keys: '$^', cnn_keys: 'image', cnn_depth: 96, mlp_layers: 5, mlp_units: 1024}
  actor: {layers: 5, dist: 'onehot', std: 'none'}
  value: {layers: 5}
  reward_head: {layers: 5}
  cont_head: {layers: 5}
  imag_gradient: 'reinforce'

atari100k:
  steps: 4e5
  envs: 1
  action_repeat: 4
  train_ratio: 1024
  video_pred_log: true
  eval_episode_num: 5
  actor: {dist: 'onehot', std: 'none'}
  imag_gradient: 'reinforce'
  stickey: False
  lives: unused
  noops: 30
  resize: opencv
  actions: needed
  time_limit: 108000

minecraft:
  task: minecraft_diamond
  step: 1e8
  parallel: True
  envs: 16
  # no eval
  eval_episode_num: 0
  eval_every: 1e4
  action_repeat: 1
  train_ratio: 16
  video_pred_log: true
  dyn_hidden: 1024
  dyn_deter: 4096
  units: 1024
  encoder: {mlp_keys: 'inventory|inventory_max|equipped|health|hunger|breath|obs_reward', cnn_keys: 'image', cnn_depth: 96, mlp_layers: 5, mlp_units: 1024}
  decoder: {mlp_keys: 'inventory|inventory_max|equipped|health|hunger|breath', cnn_keys: 'image', cnn_depth: 96, mlp_layers: 5, mlp_units: 1024}
  actor: {layers: 5, dist: 'onehot', std: 'none'}
  value: {layers: 5}
  reward_head: {layers: 5}
  cont_head: {layers: 5}
  imag_gradient: 'reinforce'
  break_speed: 100.0
  time_limit: 36000

memorymaze:
  steps: 1e8
  action_repeat: 2
  actor: {dist: 'onehot', std: 'none'}
  imag_gradient: 'reinforce'
  task: 'memorymaze_9x9'

debug:
  debug: True
  pretrain: 1
  prefill: 1
  batch_size: 10
  batch_length: 20
